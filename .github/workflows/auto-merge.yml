name: Review contributor PRs

# pull_request_target runs this file from the base branch, so a PR cannot edit
# its own review rules. Nothing here checks out or executes PR content.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prefix = `contributors/${pr.user.login.toLowerCase()}/`;
            const MARKER = '<!-- la-workshop-bot -->';

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });

            const needsReview = [];
            const broken = [];
            const notNeutral = [];
            const suspicious = [];

            const checkDescriptions = (fileName, where, reaction) =>
            {
              if (!reaction || typeof reaction !== 'object')
                return;
              for (const key of ['triggerDescription', 'effectDescription'])
              {
                if (typeof reaction[key] === 'string' && reaction[key].trim() !== '')
                  notNeutral.push(`\`${fileName}\`: ${where} has a non-empty \`${key}\`.`);
              }
            };

            const SUSPICIOUS_PATTERNS = [
              [/\bfetch\s*\(/, 'network call (fetch)'],
              [/\bXMLHttpRequest\b/, 'network call (XMLHttpRequest)'],
              [/\bWebSocket\b/, 'network call (WebSocket)'],
              [/\bsendBeacon\b/, 'network call (sendBeacon)'],
              [/\bimport\s*\(\s*['"`]https?:/i, 'remote code import'],
              [/\beval\s*\(/, 'eval'],
              [/new\s+Function\s*\(/, 'dynamic Function constructor'],
              [/\batob\s*\(/, 'base64 decoding'],
              [/String\.fromCharCode/, 'char-code obfuscation'],
              [/(\\x[0-9a-fA-F]{2}){8,}/, 'hex-escape obfuscation'],
              [/(\\u[0-9a-fA-F]{4}){8,}/, 'unicode-escape obfuscation'],
              [/[A-Za-z0-9+/]{200,}={0,2}/, 'long base64-like blob'],
              [/document\.cookie/, 'cookie access'],
              [/\blocalStorage\b|\bsessionStorage\b/, 'browser storage access'],
              [/<script/i, 'script tag injection'],
              [/\bdeleteDocuments\b/, 'mass document deletion'],
              [/\bownership\b\s*[:=]/, 'document ownership change'],
              [/game\.settings\.set\s*\(\s*['"`](?!lancer-automations|world)/, 'foreign module settings write'],
              [/FilePicker\.upload/, 'file upload'],
            ];
            const scanCode = (fileName, where, source) =>
            {
              for (const [pattern, label] of SUSPICIOUS_PATTERNS)
              {
                if (pattern.test(source))
                  suspicious.push(`\`${fileName}\`: ${where} contains ${label}.`);
              }
              if (source.split('\n').some(line => line.length > 2000))
                suspicious.push(`\`${fileName}\`: ${where} has a very long single line (minified or obfuscated code).`);
            };

            // Every string is scanned: code hides in serialized lambdas and template fields too.
            const collectCode = (node, fileName, where) =>
            {
              if (typeof node === 'string')
              {
                if (node.trim())
                  scanCode(fileName, `\`${where}\``, node);
                return;
              }
              if (Array.isArray(node))
              {
                node.forEach((sub, index) => collectCode(sub, fileName, `${where}[${index}]`));
                return;
              }
              if (!node || typeof node !== 'object')
                return;
              for (const [key, value] of Object.entries(node))
                collectCode(value, fileName, `${where}.${key}`);
            };

            if (!files.length)
              needsReview.push('This pull request changes no files.');

            for (const file of files)
            {
              if (/(^|\/)\.\.(\/|$)/.test(file.filename) || file.filename.includes('\\'))
                needsReview.push(`\`${file.filename}\` has an unsafe path.`);
              else if (!file.filename.toLowerCase().startsWith(prefix))
                needsReview.push(`\`${file.filename}\` is outside \`${prefix}\`.`);
              else if (!/\.(json|md)$/i.test(file.filename))
                needsReview.push(`\`${file.filename}\` is not a .json or .md file.`);
            }

            // JSON is only parsed, never run.
            const headRepo = pr.head.repo;
            for (const file of files)
            {
              if (file.status === 'removed' || !/\.json$/i.test(file.filename))
                continue;
              if (!headRepo)
              {
                needsReview.push('The source branch is gone, cannot read the files.');
                break;
              }
              try
              {
                const res = await github.rest.repos.getContent({
                  owner: headRepo.owner.login,
                  repo: headRepo.name,
                  path: file.filename,
                  ref: pr.head.sha,
                });
                const data = JSON.parse(Buffer.from(res.data.content, 'base64').toString('utf8'));
                collectCode(data, file.filename, '$');
                if (data && data.isGeneral === false && data.reaction)
                  checkDescriptions(file.filename, `item activation \`${data.lid || '?'}\``, data.reaction);
                if (data && data.itemReactions && typeof data.itemReactions === 'object')
                {
                  for (const [lid, group] of Object.entries(data.itemReactions))
                  {
                    const reactions = Array.isArray(group?.reactions) ? group.reactions : [];
                    reactions.forEach((reaction, index) =>
                      checkDescriptions(file.filename, `item activation \`${lid}\` #${index + 1}`, reaction));
                  }
                }
              }
              catch (err)
              {
                broken.push(`\`${file.filename}\` is not valid JSON: ${err.message}`);
              }
            }

            const say = async (body) =>
            {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const mine = comments.find(comment => comment.body.startsWith(MARKER));
              const full = `${MARKER}\n${body}`;
              if (mine && mine.body === full)
                return;
              if (mine)
                await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: full });
              else
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: full });
            };

            const label = async (name) =>
            {
              try
              {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [name] });
              }
              catch (err)
              {
                core.info(`Could not add the ${name} label: ${err.message}`);
              }
            };

            if (broken.length)
            {
              await say(`Some files could not be parsed, so this one stays open:\n\n- ${broken.join('\n- ')}`);
              await label('broken-json');
              core.setFailed('Invalid JSON in the pull request.');
              return;
            }

            if (notNeutral.length)
            {
              await say(
                `Not merged: item-linked automations must keep \`triggerDescription\` and \`effectDescription\` empty.\n\n` +
                `- ${notNeutral.join('\n- ')}\n\n` +
                `**Why**: on an item activation the reaction popup already shows the item's own trigger/effect text from the importing user's world. These two fields only exist to override that text, so in a shared file they end up carrying the item's rules text, usually copied from an LCP. Keeping them empty keeps the workshop neutral toward the content the automation hooks into. General activations may use them freely, there is no item text to fall back on there.\n\n` +
                `**How to fix**: open the activation in the Activation Manager, blank the trigger/effect description fields, and copy/export again. Or set both to \`""\` directly in the .json. Push the fix and this check reruns.`
              );
              await label('needs-changes');
              core.setFailed('Item-linked automation with non-empty description fields.');
              return;
            }

            if (suspicious.length)
            {
              await say(
                `Held for a human look, the scanner flagged code patterns that are unusual for a table automation:\n\n` +
                `- ${suspicious.join('\n- ')}\n\n` +
                `This is not a verdict, legitimate uses and false positives happen. The repo owner will read the flagged code and merge manually if it's fine.`
              );
              await label('suspicious-code');
              return;
            }

            if (needsReview.length)
            {
              await say(
                `Not auto-merged, a human needs to look at it:\n\n- ${needsReview.join('\n- ')}\n\n` +
                `Auto-merge only covers pull requests where every file lives in \`${prefix}\` and is a .json or .md file.`
              );
              await label('needs-review');
              return;
            }

            await say(
              `First review passed: everything lives in your own folder, the JSON is valid, descriptions are clean, and the code scanner found nothing unusual.\n\n` +
              `Waiting for the repo owner's approval to merge.`
            );
            await label('checks-passed');
